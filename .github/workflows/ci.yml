name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check .
      - name: Test
        run: uv run --python 3.12 --group dev pytest -q

  eval:
    # Runs the 80-question labeled set. Fails the build if answers cite outdated (superseded) library entries in
    # more than 2% of answered questions, if fewer than 80% of unanswerable questions go to the SME queue, or if
    # retrieval recall@5 drops below 90%.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Eval gate
        run: |
          uv run --python 3.12 rfpcopilot eval --compare --gate \
            --max-outdated 0.02 --min-abstention 0.8 --min-recall 0.9 \
            --summary "$GITHUB_STEP_SUMMARY" --out reports/eval.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/eval.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rfp-copilot:ci .
      - name: Smoke test container
        run: |
          docker run -d --name rfp -p 8822:8822 rfp-copilot:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8822/healthz && break; sleep 1; done
          curl -sf -X POST http://localhost:8822/api/questionnaires/sample/merrow-health-rfp.csv | grep auto_approved
          curl -sf http://localhost:8822/metrics | grep rfpcopilot_questions_total
          docker rm -f rfp
