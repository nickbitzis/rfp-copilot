[project]
name = "rfpcopilot"
version = "1.0.0"
description = "Drafts cited answers to RFPs and security questionnaires from an approved answer library and policy docs, with review, write-back, and an eval gate."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
claude = ["anthropic>=2.6"]

[project.scripts]
rfpcopilot = "rfpcopilot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfpcopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File"]
